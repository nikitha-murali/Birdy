<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a9e8ff">
  <title>Birdy - Flight Run</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Courier New", monospace;
      color: #f9f4d0;
      background: #253c58;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
    }

    main {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #9fe4f5;
    }

    .heading {
      position: absolute;
      z-index: 2;
      top: max(16px, env(safe-area-inset-top));
      left: max(18px, env(safe-area-inset-left));
      right: max(18px, env(safe-area-inset-right));
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
      pointer-events: none;
    }

    .score {
      flex: 0 0 auto;
      padding: 8px 12px;
      border: 3px solid #fff3bd;
      border-radius: 4px;
      background: #31576a;
      color: #fff3bd;
      font-weight: 800;
      text-align: center;
      pointer-events: auto;
      box-shadow: 3px 3px 0 #244052;
    }

    .score strong {
      display: block;
      color: #ffce52;
      font-size: 1.25rem;
      line-height: 1.1;
    }

    .game-shell {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #9de1f5;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      image-rendering: pixelated;
      touch-action: manipulation;
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    .hud-button {
      min-height: 42px;
      padding: 8px 10px;
      border: 3px solid #fff3bd;
      border-radius: 4px;
      background: #31576a;
      box-shadow: 3px 3px 0 #244052;
      color: #fff3bd;
      font-size: 0.72rem;
      white-space: nowrap;
    }

    .panel {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: #18374d55;
      text-align: center;
    }

    .panel[hidden] { display: none; }

    .game-ready .heading,
    .game-ready .help { visibility: hidden; }

    .cover-screen {
      background: linear-gradient(180deg, #17384c88 0%, #17384c35 48%, #17384caa 100%);
    }

    .cover-content {
      width: min(100%, 760px);
      padding: 22px 16px;
    }

    .cover-screen .cover-content {
      border: 0;
      background: transparent;
      box-shadow: none;
      color: #fffdf2;
    }

    .panel:not(.cover-screen) .cover-kicker { display: none; }

    .cover-kicker {
      margin: 0 0 16px;
      color: #fff3bd;
      font-size: clamp(.65rem, 2vw, .9rem);
      font-weight: 800;
      letter-spacing: .28em;
      text-shadow: 2px 2px 0 #31576a;
    }

    .cover-screen h2 {
      margin: 0;
      color: #ffce52;
      font-size: clamp(4rem, 13vw, 8.75rem);
      letter-spacing: -.09em;
      line-height: .78;
      text-shadow: 5px 5px 0 #31576a, 10px 10px 0 #fff3bd;
    }

    .cover-subtitle {
      max-width: 520px;
      margin: 26px auto 30px;
      color: #fffdf2;
      font-size: clamp(.78rem, 2.2vw, 1rem);
      font-weight: 700;
      line-height: 1.6;
      text-shadow: 2px 2px 0 #31576a;
    }

    .cover-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .cover-actions button { min-width: 200px; }
    .cover-actions .secondary { margin-left: 0; }

    .reward-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
    }

    .reward-badge {
      padding: 6px 10px;
      border: 1px solid #fff3bd99;
      border-radius: 999px;
      background: #31576a55;
      color: #f1f0dc;
      font-size: .62rem;
      font-weight: 800;
      text-shadow: 1px 1px 0 #244052;
    }

    .reward-badge.is-earned {
      border-color: #ffce52;
      background: #ffce52;
      color: #31576a;
      text-shadow: none;
    }

    .panel:not(.cover-screen) .reward-list { display: none; }

    .panel-summary { white-space: pre-line; }

    .countdown {
      position: absolute;
      z-index: 1;
      inset: 0;
      display: grid;
      place-items: center;
      color: #ffce52;
      font-size: clamp(6rem, 24vw, 13rem);
      font-weight: 900;
      line-height: 1;
      pointer-events: none;
      text-shadow: 5px 5px 0 #31576a, 10px 10px 0 #fff3bd;
    }

    .countdown[hidden] { display: none; }
    .countdown.count-pop { animation: count-pop 700ms steps(5, end) both; }

    @keyframes count-pop {
      0% { opacity: 0; transform: scale(.55); }
      65% { opacity: 1; transform: scale(1.12); }
      100% { opacity: 1; transform: scale(1); }
    }

    .card {
      width: min(100%, 380px);
      padding: 24px;
      border: 3px solid #fff;
      border-radius: 18px;
      background: #fffdf2;
      box-shadow: 0 8px 0 #25485830;
      color: #31576a;
    }

    h2 {
      margin: 0 0 8px;
      color: #31576a;
      font-size: 1.55rem;
    }

    .panel-summary {
      margin: 0 0 17px;
      color: #65808b;
      line-height: 1.5;
    }

    button {
      min-height: 46px;
      padding: 11px 18px;
      border: 0;
      border-radius: 10px;
      background: #e98135;
      box-shadow: 0 4px 0 #b95326;
      color: #fff8df;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      transition: transform 100ms ease, filter 100ms ease;
    }

    button:hover { filter: brightness(1.04); }
    button:active { transform: translateY(3px); box-shadow: 0 1px 0 #d1742e; }
    button:focus-visible { outline: 3px solid #347a9b; outline-offset: 4px; }

    .secondary {
      margin-left: 8px;
      background: #4a9eb0;
      box-shadow: 0 4px 0 #347483;
    }

    .secondary:active { box-shadow: 0 1px 0 #347483; }

    .help {
      position: absolute;
      z-index: 2;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(14px, env(safe-area-inset-bottom));
      left: max(18px, env(safe-area-inset-left));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      color: #fff;
      font-size: clamp(0.58rem, 2vw, 0.76rem);
      text-shadow: 2px 2px 0 #31576a;
      pointer-events: none;
    }

    .meter-wrap {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .meter {
      width: 110px;
      height: 10px;
      overflow: hidden;
      border: 2px solid #fff3bd;
      border-radius: 0;
      background: #31576a;
    }

    .meter-fill {
      width: 0%;
      height: 100%;
      border-radius: 0;
      background: #ffce52;
      transition: width 60ms linear;
    }

    @media (max-width: 560px) {
      .heading { gap: 8px; }
      .score { padding: 6px 8px; font-size: 0.68rem; }
      .score strong { font-size: 1rem; }
      .top-controls { gap: 5px; }
      .hud-button { min-height: 38px; padding: 6px; font-size: 0.58rem; }
      .help { align-items: flex-start; flex-direction: column; gap: 5px; }
      .card { padding: 19px 15px; }
      .secondary { margin: 10px 0 0; }
      .cover-content { padding: 20px 10px; }
      .cover-kicker { margin-bottom: 13px; }
      .cover-screen h2 { font-size: clamp(3.4rem, 18vw, 5.5rem); }
      .cover-subtitle { max-width: 300px; margin: 20px auto 24px; }
      .cover-actions { flex-direction: column; align-items: center; gap: 10px; }
      .cover-actions button { width: min(100%, 280px); }
    }
  </style>
</head>
<body>
  <main class="game-ready">
    <header class="heading">
      <div class="top-controls">
        <div class="score" aria-live="polite">SCORE<strong id="score">0</strong></div>
        <button class="hud-button" id="pause-button" type="button" aria-label="Pause game" hidden>Pause</button>
        <button class="hud-button" id="music-button" type="button" aria-pressed="true">♫ Music: On</button>
        <button class="hud-button" id="fullscreen-button" type="button">⛶ Fullscreen</button>
      </div>
    </header>

    <section class="game-shell" aria-label="Birdy flight game">
      <canvas id="game" width="960" height="540" aria-label="A bird flies between green pipes"></canvas>
      <div class="countdown" id="countdown" role="status" aria-live="assertive" hidden></div>
      <div class="panel cover-screen" id="panel">
        <div class="card cover-content">
          <p class="cover-kicker">BIRDY / FLIGHT RUN</p>
          <h2 id="panel-title">BIRDY</h2>
          <p class="cover-subtitle" id="cover-subtitle">Stay airborne. Beat your best.</p>
          <div class="reward-list" id="reward-list" role="list" aria-label="Flight rewards"></div>
          <p class="panel-summary" id="panel-text" hidden></p>
          <div class="cover-actions">
            <button id="mic-button" type="button">🎙 Play with voice</button>
            <button class="secondary" id="keyboard-button" type="button">Play with keyboard</button>
          </div>
          <p id="mic-error" role="status" style="min-height:1em;margin:12px 0 0;color:#a45043;font-size:.84rem"></p>
        </div>
      </div>
    </section>

    <footer class="help">
      <span id="status">Use your voice, or press Space / ↑ / tap to flap.</span>
      <span class="meter-wrap"><span>Voice power</span><span class="meter" aria-hidden="true"><span class="meter-fill" id="meter-fill"></span></span></span>
    </footer>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("game");
      const displayContext = canvas.getContext("2d");
      const panel = document.getElementById("panel");
      const scoreLabel = document.getElementById("score");
      const status = document.getElementById("status");
      const meterFill = document.getElementById("meter-fill");
      const micError = document.getElementById("mic-error");
      const micButton = document.getElementById("mic-button");
      const keyboardButton = document.getElementById("keyboard-button");
      const pauseButton = document.getElementById("pause-button");
      const musicButton = document.getElementById("music-button");
      const fullscreenButton = document.getElementById("fullscreen-button");
      const panelTitle = document.getElementById("panel-title");
      const panelText = document.getElementById("panel-text");
      const coverSubtitle = document.getElementById("cover-subtitle");
      const rewardList = document.getElementById("reward-list");
      const countdown = document.getElementById("countdown");
      const gameRoot = document.querySelector("main");
      const W = canvas.width;
      const H = canvas.height;
      const pixelCanvas = document.createElement("canvas");
      pixelCanvas.width = 320;
      pixelCanvas.height = 180;
      const ctx = pixelCanvas.getContext("2d");
      ctx.scale(pixelCanvas.width / W, pixelCanvas.height / H);
      const groundHeight = 62;
      const pipeWidth = 82;
      const gapHeight = 300;
      let state = "ready";
      let countdownRemaining = 0;
      let displayedCountdown = 0;
      let bird;
      let pipes = [];
      let score = 0;
      let best = Number(localStorage.getItem("birdsong-best") || 0);
      let lastTime = 0;
      let elapsed = 0;
      let audioContext;
      let analyser;
      let microphoneStream;
      let voicePower = 0;
      let voiceHold = 0;
      let micEnabled = false;
      let keyboardMode = false;
      let musicEnabled = true;
      let musicTimer;
      let musicStep = 0;
      const rewards = [
        { score: 1, title: "First Flight" },
        { score: 5, title: "Five Pipes" },
        { score: 10, title: "Ten Pipes" }
      ];
      const audioSamples = new Uint8Array(1024);
      const melody = [523, 587, 659, 784, 659, 587, 523, 587, 494, 523, 587, 659, 587, 523, 494, 523];

      function getAudioContext() {
        if (!audioContext) {
          const AudioContextConstructor = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextConstructor) throw new Error("Web Audio is not supported in this browser.");
          audioContext = new AudioContextConstructor();
        }
        return audioContext;
      }

      function playTone(frequency, startTime, duration, volume, type) {
        const audio = getAudioContext();
        const oscillator = audio.createOscillator();
        const gain = audio.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, startTime);
        gain.gain.setValueAtTime(0.001, startTime);
        gain.gain.linearRampToValueAtTime(volume, startTime + 0.07);
        gain.gain.setValueAtTime(volume, startTime + duration * 0.7);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
        oscillator.connect(gain);
        gain.connect(audio.destination);
        oscillator.start(startTime);
        oscillator.stop(startTime + duration + 0.01);
      }

      function playHitSound() {
        if (!audioContext) return;
        const startTime = audioContext.currentTime;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = "triangle";
        oscillator.frequency.setValueAtTime(160, startTime);
        oscillator.frequency.exponentialRampToValueAtTime(70, startTime + 0.14);
        gain.gain.setValueAtTime(0.08, startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.16);
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start(startTime);
        oscillator.stop(startTime + 0.17);
      }

      async function startMusic() {
        if (!musicEnabled || musicTimer) return;
        const audio = getAudioContext();
        await audio.resume();
        musicStep = 0;
        const playNextBeat = () => {
          const now = audio.currentTime + 0.02;
          const note = melody[musicStep % melody.length];
          playTone(note, now, 0.34, 0.018, "sine");
          if (musicStep % 4 === 0) playTone(note / 2, now, 0.58, 0.012, "triangle");
          musicStep++;
        };
        playNextBeat();
        musicTimer = window.setInterval(playNextBeat, 380);
      }

      function stopMusic() {
        if (musicTimer) window.clearInterval(musicTimer);
        musicTimer = undefined;
      }

      function syncFullscreenButton() {
        const isFullscreen = Boolean(document.fullscreenElement);
        fullscreenButton.textContent = isFullscreen ? "⛶ Exit fullscreen" : "⛶ Fullscreen";
        fullscreenButton.setAttribute("aria-label", isFullscreen ? "Exit fullscreen" : "Enter fullscreen");
      }

      function reset() {
        bird = { x: 230, y: 200, vy: 0, rotation: 0 };
        pipes = [
          { x: 700, gapY: 240, scored: false },
          { x: 1070, gapY: 260, scored: false },
          { x: 1440, gapY: 245, scored: false }
        ];
        score = 0;
        elapsed = 0;
        scoreLabel.textContent = "0";
      }

      function renderRewards() {
        rewardList.replaceChildren();
        for (const reward of rewards) {
          const earned = best >= reward.score;
          const badge = document.createElement("span");
          badge.className = earned ? "reward-badge is-earned" : "reward-badge";
          badge.textContent = `${earned ? "★" : "☆"} ${reward.title}`;
          badge.setAttribute("role", "listitem");
          badge.setAttribute("aria-label", earned ? `${reward.title}, unlocked` : `${reward.title}, unlock at ${reward.score} pipes`);
          rewardList.appendChild(badge);
        }
      }

      function rect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
      }

      function drawBackground() {
        rect(0, 0, W, H, "#9fe4f5");
        const skyGradient = ctx.createLinearGradient(0, 0, 0, H - groundHeight);
        skyGradient.addColorStop(0, "#a9e8f7");
        skyGradient.addColorStop(1, "#8bd5e7");
        ctx.fillStyle = skyGradient;
        ctx.fillRect(0, 0, W, H - groundHeight);
        // Soft blocky clouds
        const cloudOffset = (elapsed * 12) % (W + 220);
        for (let i = 0; i < 4; i++) {
          const x = ((i * 290 - cloudOffset + W + 220) % (W + 220)) - 110;
          const y = 82 + (i % 2) * 92;
          rect(x + 24, y, 80, 18, "#eaffff");
          rect(x + 10, y + 16, 110, 17, "#eaffff");
          rect(x + 30, y - 10, 48, 12, "#eaffff");
        }
        const trees = [
          { x: 130, scale: 0.9 },
          { x: 795, scale: 0.82 }
        ];
        for (const tree of trees) {
          ctx.save();
          ctx.translate(tree.x, H - groundHeight);
          ctx.scale(tree.scale, tree.scale);
          ctx.fillStyle = "#79583d";
          ctx.fillRect(-6, -218, 12, 218);
          ctx.strokeStyle = "#79583d";
          ctx.lineWidth = 7;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(0, -184);
          ctx.lineTo(-18, -215);
          ctx.moveTo(0, -190);
          ctx.lineTo(18, -219);
          ctx.stroke();
          ctx.fillStyle = "#4d9658";
          ctx.beginPath();
          ctx.ellipse(0, -237, 27, 36, 0, 0, Math.PI * 2);
          ctx.ellipse(-18, -221, 21, 25, 0, 0, Math.PI * 2);
          ctx.ellipse(19, -220, 21, 26, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#6db96c";
          ctx.beginPath();
          ctx.ellipse(-4, -250, 19, 23, 0, 0, Math.PI * 2);
          ctx.ellipse(17, -234, 14, 18, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      function drawPipe(pipe) {
        const topHeight = pipe.gapY - gapHeight / 2;
        const bottomY = pipe.gapY + gapHeight / 2;
        const colors = ["#4cba68", "#32a653", "#218b49"];
        rect(pipe.x, 0, pipeWidth, topHeight - 24, colors[1]);
        rect(pipe.x - 8, topHeight - 24, pipeWidth + 16, 24, colors[0]);
        rect(pipe.x + 10, 0, 10, topHeight - 24, "#7cda7d");
        rect(pipe.x, bottomY + 24, pipeWidth, H - groundHeight - bottomY - 24, colors[1]);
        rect(pipe.x - 8, bottomY, pipeWidth + 16, 24, colors[0]);
        rect(pipe.x + 10, bottomY + 24, 10, H - groundHeight - bottomY - 24, "#7cda7d");
        rect(pipe.x + pipeWidth - 12, 0, 8, topHeight - 24, colors[2]);
        rect(pipe.x + pipeWidth - 12, bottomY + 24, 8, H - groundHeight - bottomY - 24, colors[2]);
      }

      function drawGround() {
        rect(0, H - groundHeight, W, 14, "#80cc66");
        rect(0, H - groundHeight + 14, W, groundHeight - 14, "#e8c879");
        const offset = (elapsed * 220) % 36;
        for (let x = -offset; x < W; x += 36) {
          rect(x, H - groundHeight + 14, 18, 8, "#dcb86b");
          rect(x + 18, H - groundHeight + 28, 18, 8, "#dcb86b");
          rect(x, H - 11, 18, 7, "#dcb86b");
        }
      }

      function drawBird() {
        ctx.save();
        ctx.translate(Math.round(bird.x), Math.round(bird.y));
        ctx.rotate(bird.rotation);
        const wing = state === "playing" && Math.sin(elapsed * 20) > 0 ? 1 : 0;
        rect(-24, -16, 36, 32, "#f7c943");
        rect(-16, -24, 26, 48, "#f7c943");
        rect(-28, -8, 8, 16, "#f7c943");
        rect(-13, wing ? 1 : -4, 19, 13, "#e9a92e");
        rect(-8, wing ? 7 : -1, 13, 7, "#d98f28");
        rect(12, -6, 14, 10, "#f28a36");
        rect(18, 1, 10, 6, "#e8752d");
        rect(5, -12, 7, 7, "#fffdf2");
        rect(9, -10, 4, 4, "#293846");
        rect(3, 5, 7, 4, "#f39b67");
        rect(-31, -8, 8, 7, "#e7a82b");
        rect(-36, -13, 7, 7, "#e7a82b");
        ctx.restore();
      }

      function render() {
        drawBackground();
        if (state !== "ready") {
          for (const pipe of pipes) drawPipe(pipe);
        }
        drawGround();
        drawBird();
        displayContext.imageSmoothingEnabled = false;
        displayContext.drawImage(pixelCanvas, 0, 0, W, H);
      }

      function updateVoice(delta) {
        if (!analyser || !micEnabled) {
          voicePower = 0;
          voiceHold = 0;
          meterFill.style.width = "0%";
          return;
        }
        analyser.getByteTimeDomainData(audioSamples);
        let sum = 0;
        for (const sample of audioSamples) {
          const value = (sample - 128) / 128;
          sum += value * value;
        }
        const rms = Math.sqrt(sum / audioSamples.length);
        const targetPower = Math.max(0, Math.min(1, (rms - 0.014) * 30));
        if (targetPower > 0.08) {
          voicePower += (targetPower - voicePower) * (1 - Math.exp(-delta / 0.08));
          voiceHold = 1;
        } else if (voiceHold > 0) {
          voiceHold = Math.max(0, voiceHold - delta);
        } else {
          voicePower = Math.max(0, voicePower - delta / 0.35);
        }
        meterFill.style.width = `${Math.round(voicePower * 100)}%`;
      }

      function endGame() {
        if (state !== "playing") return;
        state = "over";
        const previousBest = best;
        if (score > best) {
          best = score;
          localStorage.setItem("birdsong-best", String(best));
        }
        panelTitle.textContent = "Game over";
        panelText.textContent = `Score: ${score}  |  Best: ${best}`;
        const newlyEarned = rewards
          .filter(reward => previousBest < reward.score && score >= reward.score)
          .map(reward => reward.title);
        if (newlyEarned.length) panelText.textContent += `\nRewards unlocked: ${newlyEarned.join(", ")}`;
        panelText.hidden = false;
        renderRewards();
        micButton.textContent = micEnabled ? "↻ Play again" : "🎙 Enable microphone";
        keyboardButton.textContent = "Play with keyboard";
        micButton.hidden = !micEnabled;
        keyboardButton.hidden = false;
        pauseButton.hidden = true;
        panel.hidden = false;
        status.textContent = "Game over — sing or flap to try again.";
      }

      function startGame(useKeyboard) {
        keyboardMode = useKeyboard;
        reset();
        state = "countdown";
        countdownRemaining = 3;
        pauseButton.hidden = true;
        gameRoot.classList.remove("game-ready");
        panel.classList.remove("cover-screen");
        coverSubtitle.hidden = true;
        panel.hidden = true;
        countdown.hidden = false;
        displayedCountdown = 0;
        updateCountdownDisplay(3);
        micButton.hidden = true;
        keyboardButton.hidden = true;
        status.textContent = "Starting in 3...";
        if (musicEnabled) {
          startMusic().catch(error => {
            musicEnabled = false;
            musicButton.textContent = "♫ Music: Off";
            musicButton.setAttribute("aria-pressed", "false");
            status.textContent = error.message || "Couldn't start background music.";
          });
        } else {
          try {
            const audio = getAudioContext();
            if (audio.state === "suspended") {
              audio.resume().catch(error => {
                status.textContent = error.message || "Couldn't enable game audio.";
              });
            }
          } catch (error) {
            status.textContent = error.message || "Game audio isn't supported in this browser.";
          }
        }
      }

      function updateCountdownDisplay(value) {
        if (value === displayedCountdown) return;
        displayedCountdown = value;
        countdown.textContent = String(value);
        countdown.classList.remove("count-pop");
        void countdown.offsetWidth;
        countdown.classList.add("count-pop");
      }

      function flap() {
        if (state === "ready" || state === "over") {
          startGame(keyboardMode);
          return;
        }
        if (state !== "playing") return;
        bird.vy = -270;
      }

      function togglePause() {
        if (state === "playing") {
          state = "paused";
          pauseButton.textContent = "Resume";
          pauseButton.setAttribute("aria-label", "Resume game");
          voicePower = 0;
          voiceHold = 0;
          meterFill.style.width = "0%";
          status.textContent = "Paused. Select Resume to continue.";
        } else if (state === "paused") {
          state = "playing";
          pauseButton.textContent = "Pause";
          pauseButton.setAttribute("aria-label", "Pause game");
          status.textContent = micEnabled && !keyboardMode
            ? "Sing louder to rise; pause to descend."
            : "Press Space / ↑ / tap to flap. Sing anytime to rise!";
        }
      }

      async function enableMicrophone() {
        micError.textContent = "";
        try {
          const audio = getAudioContext();
          if (audio.state === "suspended") audio.resume().catch(error => {
            status.textContent = error.message || "Couldn't enable game audio.";
          });
        } catch (error) {
          status.textContent = error.message || "Game audio isn't supported in this browser.";
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          micError.textContent = "Microphone access needs a supported browser on HTTPS or localhost.";
          return;
        }
        try {
          microphoneStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          audioContext = getAudioContext();
          analyser = audioContext.createAnalyser();
          await audioContext.resume();
          analyser.fftSize = 2048;
          audioContext.createMediaStreamSource(microphoneStream).connect(analyser);
          micEnabled = true;
          status.textContent = "Microphone ready — sing louder to rise; pause to descend.";
          startGame(false);
        } catch (error) {
          micError.textContent = error.name === "NotAllowedError"
            ? "Microphone permission was blocked. Allow it in your browser, or use keyboard controls."
            : "Couldn't start the microphone. Try keyboard controls instead.";
        }
      }

      function update(delta) {
        if (state === "paused") return;
        elapsed += delta;
        updateVoice(delta);
        if (state === "countdown") {
          countdownRemaining -= delta;
          if (countdownRemaining <= 0) {
            state = "playing";
            countdown.hidden = true;
            pauseButton.hidden = false;
            pauseButton.textContent = "Pause";
            pauseButton.setAttribute("aria-label", "Pause game");
            status.textContent = micEnabled && !keyboardMode
              ? "Sing louder to rise; pause to descend."
              : "Press Space / ↑ / tap to flap. Sing anytime to rise!";
            voicePower = 0;
            voiceHold = 0;
          } else {
            const count = Math.ceil(countdownRemaining);
            updateCountdownDisplay(count);
            status.textContent = `Starting in ${count}...`;
          }
          return;
        }
        if (state !== "playing") return;
        const speed = 125 + Math.min(score * 2, 30);
        bird.vy += (540 - voicePower * 1200) * delta;
        bird.vy = Math.max(-320, Math.min(320, bird.vy));
        bird.y += bird.vy * delta;
        bird.rotation = Math.max(-0.45, Math.min(0.85, bird.vy / 650));

        for (const pipe of pipes) {
          pipe.x -= speed * delta;
          if (!pipe.scored && pipe.x + pipeWidth < bird.x) {
            pipe.scored = true;
            score++;
            scoreLabel.textContent = String(score);
          }
          const withinBird = bird.x + 19 > pipe.x - 8 && bird.x - 19 < pipe.x + pipeWidth + 8;
          if (withinBird && (bird.y - 16 < pipe.gapY - gapHeight / 2 || bird.y + 16 > pipe.gapY + gapHeight / 2)) {
            playHitSound();
            endGame();
          }
        }
        if (pipes[0].x + pipeWidth < -10) {
          pipes.shift();
          const lastPipe = pipes[pipes.length - 1];
          const gapY = Math.max(180, Math.min(300, lastPipe.gapY + (Math.random() - 0.5) * 120));
          pipes.push({ x: lastPipe.x + 370, gapY, scored: false });
        }
        if (bird.y - 18 < 0 || bird.y + 18 > H - groundHeight) endGame();
      }

      function frame(time) {
        const delta = Math.min((time - (lastTime || time)) / 1000, 0.035);
        lastTime = time;
        update(delta);
        render();
        requestAnimationFrame(frame);
      }

      micButton.addEventListener("click", () => {
        if (state === "over" && micEnabled) startGame(false);
        else enableMicrophone();
      });
      keyboardButton.addEventListener("click", () => startGame(true));
      pauseButton.addEventListener("click", togglePause);
      musicButton.addEventListener("click", () => {
        musicEnabled = !musicEnabled;
        musicButton.textContent = musicEnabled ? "♫ Music: On" : "♫ Music: Off";
        musicButton.setAttribute("aria-pressed", String(musicEnabled));
        if (musicEnabled) {
          startMusic().catch(error => {
            musicEnabled = false;
            musicButton.textContent = "♫ Music: Off";
            musicButton.setAttribute("aria-pressed", "false");
            status.textContent = error.message || "Couldn't start background music.";
          });
        } else {
          stopMusic();
        }
      });
      fullscreenButton.addEventListener("click", async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await document.documentElement.requestFullscreen();
        } catch (error) {
          status.textContent = error.message || "Fullscreen isn't available in this browser.";
        }
      });
      document.addEventListener("fullscreenchange", syncFullscreenButton);
      canvas.addEventListener("pointerdown", () => {
        if (state === "playing") flap();
        else if (state === "over") startGame(keyboardMode);
      });
      window.addEventListener("keydown", event => {
        if (event.code === "Space" || event.code === "ArrowUp") {
          event.preventDefault();
          flap();
        }
      });
      window.addEventListener("beforeunload", () => {
        if (microphoneStream) microphoneStream.getTracks().forEach(track => track.stop());
        stopMusic();
        if (audioContext) audioContext.close();
      });

      reset();
      renderRewards();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
